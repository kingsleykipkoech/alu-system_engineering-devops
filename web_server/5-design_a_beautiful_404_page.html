<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Ceci n'est pas une page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #0a0a0a;
            --charcoal: #121212;
            --border: #222222;
            --gold: #D4A84B;
            --gold-glow: rgba(212, 168, 75, 0.15);
            --pearl: #e8e8e8;
            --mist: #888888;
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--obsidian);
            color: var(--pearl);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .ambient-glow {
            position: absolute;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            width: 100%;
            background: var(--charcoal);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 56px 40px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(5rem, 12vw, 8rem);
            font-weight: 600;
            line-height: 1;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .divider {
            width: 48px;
            height: 1px;
            background: var(--gold);
            margin: 16px auto 24px auto;
            opacity: 0.6;
        }

        .error-title {
            font-family: var(--font-display);
            font-size: 1.85rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: var(--pearl);
            margin-bottom: 12px;
        }

        .error-message {
            font-size: 1rem;
            color: var(--mist);
            line-height: 1.6;
            margin-bottom: 32px;
            font-weight: 300;
        }

        .btn-home {
            display: inline-block;
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 12px 28px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.25s ease;
        }

        .btn-home:hover {
            background: var(--gold);
            color: var(--obsidian);
            box-shadow: 0 4px 16px rgba(212, 168, 75, 0.25);
        }

        .footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #555555;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <main class="container">
        <div class="error-code">404</div>
        <div class="divider"></div>
        <h1 class="error-title">Ceci n'est pas une page</h1>
        <p class="error-message">The resource you requested does not exist or has been relocated to another dimension.</p>
        <a href="/" class="btn-home">Return to Home</a>
        <div class="footer">KUZA Architecture &bull; Web Infrastructure</div>
    </main>
</body>
</html>
